<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101528">
  <title>Hello, world! — A little welcome</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f7ff;
      background: #101528;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 22%, rgb(104 80 255 / 20%), transparent 36%),
        radial-gradient(ellipse at 83% 78%, rgb(28 205 190 / 14%), transparent 34%),
        #101528;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: min(100% - 2rem, 980px);
      padding: clamp(1.5rem, 6vw, 4rem);
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      width: 13rem;
      aspect-ratio: 1;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .scene::before { top: 0; right: 1rem; }
    .scene::after { bottom: -2rem; left: 0; width: 8rem; }

    .site-nav {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin: 0 0 1rem;
    }

    .site-nav a {
      padding: 0.65rem 0.9rem;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #cbd1e8;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
      border-color: rgb(255 255 255 / 15%);
      color: #fff;
      background: rgb(255 255 255 / 8%);
    }

    main {
      position: relative;
      overflow: hidden;
      padding: clamp(2rem, 8vw, 5.5rem);
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 1.5rem;
      background: linear-gradient(135deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 35%), inset 0 1px rgb(255 255 255 / 8%);
      backdrop-filter: blur(18px);
      animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 1.5rem;
      color: #b8c0dc;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 1.6rem;
      height: 1px;
      background: #8b7cff;
      content: "";
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 7.5rem);
      font-weight: 720;
      letter-spacing: -0.075em;
      line-height: 0.94;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #a99aff 5%, #74e5da 95%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 34rem;
      margin: 1.75rem 0 0;
      color: #b8c0dc;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.75;
    }

    .signature {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 2.75rem;
      color: #e2e5f2;
      font-size: 0.85rem;
    }

    .sparkle { color: #78e4d7; font-size: 1.1rem; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="hello-world.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <main>
      <p class="eyebrow">A small beginning</p>
      <h1>Hello,<span>world!</span></h1>
      <p class="intro">Every great idea starts somewhere. Here’s to the first line, the next big thing, and everything in between.</p>
      <div class="signature"><span class="sparkle" aria-hidden="true">✦</span> Made for what comes next</div>
    </main>
  </div>
</body>
</html>
